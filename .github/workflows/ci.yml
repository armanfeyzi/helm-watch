# CI for helm-watch.
# Security scans (gitleaks, Semgrep, Trivy image) run in report-only mode until ARM-6 enables gates.
# See docs/ci-security.md.

name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Go mod tidy check
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Run tests
        run: go test ./...

      - name: Go vet
        run: go vet ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12

      - name: SAST (gosec)
        uses: securego/gosec@master
        with:
          args: -severity high -confidence high ./...

      - name: Build Linux amd64 binary
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o dist/helm-watch-linux-amd64 ./cmd/helm-watch

      - name: Build Linux arm64 binary
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o dist/helm-watch-linux-arm64 ./cmd/helm-watch

      - name: Upload binary artifacts
        uses: actions/upload-artifact@v4
        with:
          name: helm-watch-binaries
          path: dist/*

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.15.4

      - name: Lint Helm chart
        run: helm lint ./deploy/helm-watch

      - name: Render Helm chart (template smoke)
        run: |
          set -euo pipefail
          helm template helm-watch ./deploy/helm-watch --namespace helm-watch >/dev/null
          helm template helm-watch ./deploy/helm-watch --namespace helm-watch \
            --set serviceMonitor.enabled=true \
            --set serviceMonitor.namespace=monitoring >/dev/null
          helm template helm-watch ./deploy/helm-watch --namespace helm-watch \
            --set-json 'config.repoOverrides={"vault":"https://helm.releases.hashicorp.com","redis":"oci://registry-1.docker.io/bitnamicharts"}' \
            >/dev/null
          helm template helm-watch ./deploy/helm-watch --namespace helm-watch \
            --set prometheusRule.enabled=true \
            --set prometheusRule.namespace=monitoring \
            >/dev/null

      - name: Build Docker image
        run: docker build -t helm-watch:ci .

      - name: Export Docker image artifact
        run: |
          mkdir -p dist
          docker save helm-watch:ci -o dist/helm-watch-image.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: helm-watch-image-tar
          path: dist/helm-watch-image.tar

  security-static:
    name: Security — secrets & SAST (report-only)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (full history for gitleaks)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scan (gitleaks)
        id: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: SAST (Semgrep)
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/golang
            p/security-audit
        continue-on-error: true

  container-security:
    name: Security — container image (report-only)
    needs: test-and-build
    runs-on: ubuntu-latest

    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: helm-watch-image-tar
          path: dist

      - name: Load image
        run: docker load -i dist/helm-watch-image.tar

      - name: Trivy image scan (table)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: helm-watch:ci
          format: table
          severity: CRITICAL,HIGH,MEDIUM,LOW,UNKNOWN
          exit-code: "0"

      - name: Trivy image scan (SARIF report)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: helm-watch:ci
          format: sarif
          output: trivy-image.sarif
          severity: CRITICAL,HIGH,MEDIUM,LOW,UNKNOWN
          exit-code: "0"

      - name: Upload Trivy SARIF
        uses: actions/upload-artifact@v4
        with:
          name: trivy-image-sarif
          path: trivy-image.sarif
          if-no-files-found: warn
